<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Makley - El descanso que mereces</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            overscroll-behavior: none;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* Contenedor principal — scroll vertical tipo reels */
        .reels-container {
            height: 100vh;
            width: 100vw;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .reels-container::-webkit-scrollbar { display: none; }

        /* Cada reel = pantalla completa */
        .reel {
            height: 100vh;
            width: 100vw;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            background: #000;
            overflow: hidden;
        }

        /* Imagen de fondo */
        .reel-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.5;
            z-index: 0;
            transition: opacity 0.5s;
        }

        /* Gradiente overlay */
        .reel::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(transparent, rgba(0,0,0,0.95));
            z-index: 1;
            pointer-events: none;
        }

        /* Contenido sobre la imagen */
        .reel-content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 0 20px;
            max-width: 500px;
            width: 100%;
        }

        .reel-content .tag {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(201, 168, 76, 0.2);
            border: 1px solid rgba(201, 168, 76, 0.4);
            border-radius: 50px;
            color: #c9a84c;
            font-size: 0.75em;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .reel-content h2 {
            font-size: 2em;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 10px;
            text-shadow: 0 2px 20px rgba(0,0,0,0.5);
        }
        .reel-content .desc {
            color: #aaa;
            font-size: 0.95em;
            line-height: 1.6;
            margin-bottom: 20px;
            font-weight: 300;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .reel-content .precio {
            font-size: 2.5em;
            font-weight: 700;
            color: #c9a84c;
            margin-bottom: 25px;
            text-shadow: 0 2px 20px rgba(0,0,0,0.5);
        }
        .reel-content .precio small {
            font-size: 0.35em;
            font-weight: 300;
            color: #666;
        }

        .btn-wa-reel {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #25D366;
            color: #000;
            padding: 16px 36px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.05em;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
            width: 100%;
            max-width: 320px;
        }
        .btn-wa-reel:hover {
            transform: scale(1.03);
            box-shadow: 0 0 40px rgba(37, 211, 102, 0.3);
        }

        /* Indicador de posición */
        .indicador {
            position: fixed;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }
        .indicador .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            transition: all 0.3s;
        }
        .indicador .dot.active {
            background: #c9a84c;
            width: 8px;
            height: 8px;
            box-shadow: 0 0 10px rgba(201, 168, 76, 0.5);
        }

        /* Header flotante */
        .header-flotante {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            padding: 16px 20px;
            background: linear-gradient(rgba(0,0,0,0.8), transparent);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-flotante h1 {
            font-size: 1em;
            font-weight: 700;
        }
        .header-flotante h1 span { color: #c9a84c; }
        .header-flotante .wa-icon {
            width: 40px;
            height: 40px;
            background: #25D366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 1.2em;
        }

        /* Navegación táctil */
        .swipe-hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: rgba(255,255,255,0.3);
            font-size: 0.75em;
            animation: bounce 2s infinite;
            pointer-events: none;
        }
        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(8px); }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .reel-content h2 { font-size: 1.5em; }
            .reel-content .precio { font-size: 2em; }
            .reel-content .desc { font-size: 0.85em; }
            .btn-wa-reel { padding: 14px 30px; font-size: 0.95em; }
            .header-flotante h1 { font-size: 0.85em; }
        }
        @media (min-width: 768px) {
            .reel-content { max-width: 600px; }
        }
    </style>
</head>
<body>

<!-- Header flotante -->
<div class="header-flotante">
    <h1>🛏️ <span>Makley</span></h1>
    <a class="wa-icon" href="https://wa.me/573004515809" target="_blank">💬</a>
</div>

<!-- Indicador de posición -->
<div class="indicador" id="indicador"></div>

<!-- Scroll vertical tipo reels -->
<div class="reels-container" id="reelsContainer">

</div>

<!-- Hint swipe -->
<div class="swipe-hint" id="swipeHint">⬆️ Desliza para ver más</div>

<script>
    const WHATSAPP_NUMBER = "573004515809";

    // Hero principal — Makley
    const hero = document.createElement('div');
    hero.className = 'reel';
    hero.innerHTML = `
        <img class="reel-bg" src="img/principal.jpg" alt="Makley - El descanso que mereces" style="opacity: 0.85;">
        <div class="reel-content" style="display: flex; flex-direction: column; align-items: center;">
            <div class="tag" style="font-size: 0.85em; letter-spacing: 2px;">🛏️ MAKLEY</div>
            <h2 style="font-size: 2.8em; font-weight: 800; line-height: 1.15; color: #c9a84c; text-shadow: 0 4px 30px rgba(0,0,0,0.8); margin-bottom: 5px;">
                El descanso<br>que mereces,<br>cada noche
            </h2>
            <p style="color: #ddd; font-size: 1em; font-weight: 300; margin: 15px 0 25px; text-shadow: 0 2px 10px rgba(0,0,0,0.5);">
                Colchones de calidad • Envío a toda Medellín
            </p>
            <a class="btn-wa-reel" href="https://wa.me/573004515809?text=Hola%2C%20quiero%20saber%20m%C3%A1s%20sobre%20sus%20colchones" target="_blank" style="background: #c9a84c; color: #000;">
                📱 Ver catálogo
            </a>
        </div>
    `;
    container.appendChild(hero);

    // Indicador (dot adicional para el hero)
    const heroDot = document.createElement('div');
    heroDot.className = 'dot active';
    indicador.appendChild(heroDot);

    const productos = [
        { nombre: "🔥 Combo #1", descripcion: "Base cama + Colchón semi ortopédico + 2 Almohadas", precio: 480000, img: "img/colchon-1.jpg", badge: "Oferta" },
        { nombre: "Colchón Resorte Ensacado", descripcion: "Resortes independientes que se adaptan a cada curva del cuerpo. Sin transferencia de movimiento.", precio: 580000, img: "https://images.unsplash.com/photo-1540518614846-7eded433c457?w=800", badge: "Recomendado" },
        { nombre: "Colchón Económico Familiar", descripcion: "Excelente relación calidad-precio. Resistente y cómodo para uso diario.", precio: 280000, img: "https://images.unsplash.com/photo-1507652313519-d4e9174996dd?w=800", badge: "Económico" },
        { nombre: "Colchón Doble Espuma", descripcion: "Doble capa de espuma de alta densidad. Firmeza equilibrada para descanso profundo.", precio: 380000, img: "https://images.unsplash.com/photo-1484101403633-562f891dc89a?w=800", badge: "Popular" },
        { nombre: "Colchón Hotelero Premium", descripcion: "Calidad 5 estrellas. Tela suave, soporte superior, confort absoluto.", precio: 720000, img: "https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?w=800", badge: "Premium" },
        { nombre: "Colchón Infantil Antialérgico", descripcion: "Hipoalergénico, transpirable y libre de químicos. Ideal para niños.", precio: 320000, img: "https://images.unsplash.com/photo-1616594039964-ae9021a400a0?w=800", badge: "Infantil" },
        { nombre: "Colchón King Size", descripcion: "Tamaño king con espuma viscoelástica. Máximo lujo y espacio para dos personas.", precio: 890000, img: "https://images.unsplash.com/photo-1522771739844-6a9f6d5f14af?w=800", badge: "Supremo" },
        { nombre: "Colchón Box Spring", descripcion: "Base y colchón integrados. Diseño moderno con estructura reforzada.", precio: 650000, img: "https://images.unsplash.com/photo-1582582621959-48d27397dc69?w=800", badge: "Moderno" },
        { nombre: "Colchón Viscoelástico Premium", descripcion: "Memoria de forma 3D. Se adapta a tu cuerpo y recupera su forma original.", precio: 520000, img: "https://images.unsplash.com/photo-1631049307264-da0ec9d70304?w=800", badge: "Nuevo" },
        { nombre: "Colchón Bambú Natural", descripcion: "Funda de bambú ecológica. Fresco, antibacteriano, sostenible.", precio: 480000, img: "https://images.unsplash.com/photo-1558618666-fcd25c85f82e?w=800", badge: "Ecológico" },
        { nombre: "Colchón Sistema Airflow", descripcion: "Tecnología de ventilación interna. Colchón fresco y transpirable todo el año.", precio: 610000, img: "https://images.unsplash.com/photo-1505692952047-1a78307d8eaa?w=800", badge: "Fresco" },
        { nombre: "Colchón Plegable Multiusos", descripcion: "Colchón plegable multiusos. Ideal para invitados, camping o espacios pequeños.", precio: 220000, img: "https://images.unsplash.com/photo-1604147495798-57beb5d6af73?w=800", badge: "Multiusos" }
    ];

    // Crear los reels
    const container = document.getElementById('reelsContainer');
    const indicador = document.getElementById('indicador');

    productos.forEach((p, i) => {
        const mensaje = encodeURIComponent(`Hola, quiero comprar el *${p.nombre}* ($${p.precio.toLocaleString()})`);

        const reel = document.createElement('div');
        reel.className = 'reel';
        reel.innerHTML = `
            <img class="reel-bg" src="${p.img}" alt="${p.nombre}" loading="${i === 0 ? 'eager' : 'lazy'}">
            <div class="reel-content">
                <div class="tag">${p.badge}</div>
                <h2>${p.nombre}</h2>
                <p class="desc">${p.descripcion}</p>
                <p class="precio">$${p.precio.toLocaleString()} <small>+ envío</small></p>
                <a class="btn-wa-reel" href="https://wa.me/${WHATSAPP_NUMBER}?text=${mensaje}" target="_blank">
                    💬 Comprar por WhatsApp
                </a>
            </div>
        `;
        container.appendChild(reel);

        // Indicador
        const dot = document.createElement('div');
        dot.className = 'dot' + (i === 0 ? ' active' : '');
        indicador.appendChild(dot);
    });

    // Actualizar indicador con el scroll
    container.addEventListener('scroll', () => {
        const h = container.clientHeight;
        const scrollTop = container.scrollTop;
        const idx = Math.round(scrollTop / h);

        document.querySelectorAll('.dot').forEach((d, i) => {
            d.classList.toggle('active', i === idx);
        });

        // Ocultar hint después del primer scroll
        const hint = document.getElementById('swipeHint');
        if (scrollTop > 10) {
            hint.style.opacity = '0';
            hint.style.transition = 'opacity 0.5s';
        }
    });

    // Detectar si es touch para mostrar hint
    if ('ontouchstart' in window) {
        document.getElementById('swipeHint').style.display = 'block';
    } else {
        document.getElementById('swipeHint').style.display = 'none';
    }
</script>
</body>
</html>
