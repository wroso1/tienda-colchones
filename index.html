<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Colchones Makley</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            overscroll-behavior: none;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
        }

        .reels-container {
            height: 100vh;
            width: 100vw;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .reels-container::-webkit-scrollbar { display: none; }

        .reel {
            height: 100vh;
            width: 100vw;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            background: #000;
            overflow: hidden;
        }

        .reel-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.5;
            z-index: 0;
            transition: opacity 0.5s;
        }

        .reel::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(transparent, rgba(0,0,0,0.95));
            z-index: 1;
            pointer-events: none;
        }

        .reel-content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 0 20px;
            max-width: 500px;
            width: 100%;
        }

        .reel-content .tag {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(201, 168, 76, 0.2);
            border: 1px solid rgba(201, 168, 76, 0.4);
            border-radius: 50px;
            color: #c9a84c;
            font-size: 0.75em;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .reel-content h2 {
            font-size: 1.6em;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 10px;
            text-shadow: 0 2px 20px rgba(0,0,0,0.5);
        }
        .reel-content .desc {
            color: #aaa;
            font-size: 0.95em;
            line-height: 1.6;
            margin-bottom: 20px;
            font-weight: 300;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .reel-content .precio {
            font-size: 2.5em;
            font-weight: 700;
            color: #c9a84c;
            margin-bottom: 25px;
            text-shadow: 0 2px 20px rgba(0,0,0,0.5);
        }
        .reel-content .precio small {
            font-size: 0.35em;
            font-weight: 300;
            color: #666;
        }

        .btn-wa-reel {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #25D366;
            color: #000;
            padding: 16px 36px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.05em;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
            width: 100%;
            max-width: 320px;
        }
        .btn-wa-reel:hover {
            transform: scale(1.03);
            box-shadow: 0 0 40px rgba(37, 211, 102, 0.3);
        }

        .indicador {
            position: fixed;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }
        .indicador .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            transition: all 0.3s;
        }
        .indicador .dot.active {
            background: #c9a84c;
            width: 8px;
            height: 8px;
            box-shadow: 0 0 10px rgba(201, 168, 76, 0.5);
        }

        .header-flotante {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            padding: 16px 20px;
            background: linear-gradient(rgba(0,0,0,0.8), transparent);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-flotante h1 {
            font-size: 1em;
            font-weight: 700;
        }
        .header-flotante h1 span { color: #c9a84c; }
        .header-flotante .wa-icon {
            width: 40px;
            height: 40px;
            background: #25D366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 1.2em;
        }

        .swipe-hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: rgba(255,255,255,0.3);
            font-size: 0.75em;
            animation: bounce 2s infinite;
            pointer-events: none;
        }
        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(8px); }
        }

        @media (max-width: 600px) {
            .reel-content h2 { font-size: 1.3em; }
            .reel-content .precio { font-size: 2em; }
            .reel-content .desc { font-size: 0.85em; }
            .btn-wa-reel { padding: 14px 30px; font-size: 0.95em; }
            .header-flotante h1 { font-size: 0.85em; }
        }
        @media (min-width: 768px) {
            .reel-content { max-width: 600px; }
        }
    </style>
</head>
<body>

<div class="header-flotante">
    <h1>🛏️ Colchones <span>Makley</span></h1>
    <a class="wa-icon" href="https://wa.me/573004515809" target="_blank">💬</a>
</div>

<div class="indicador" id="indicador"></div>

<div class="reels-container" id="reelsContainer">
</div>

<div class="swipe-hint" id="swipeHint">⬆️ Desliza para ver más</div>

<script>
    const WHATSAPP_NUMBER = "573004515809";

    const productos = [
        { nombre: "🔥 Base + Colchón Ortopédico + Espaldar", descripcion: "Completo set de base cama, colchón ortopédico y espaldar acolchado. La mejor relación calidad-precio.", precio: 750000, img: "img/combo-base-espaldar.jpg", badge: "Más vendido" },
        { nombre: "🔥 Cama Nube con Espaldar y Colchón Ortopédico", descripcion: "Cama nube moderna con espaldar tapizado y colchón ortopédico de alta densidad. Diseño elegante.", precio: 1300000, img: "img/cama-nube-1300.jpg", badge: "Nube" },
        { nombre: "🔥 Cama Nube con Colchón Semi Ortopédico", descripcion: "Cama nube con espaldar y colchón semi ortopédico. Combinación de confort y soporte.", precio: 1600000, img: "img/cama-nube-1600.jpg", badge: "Nube Premium" },
        { nombre: "Base Cama + Espaldar + Colchón Ortopédico", descripcion: "Base resistente, espaldar acolchado y colchón ortopédico. Set completo a precio especial.", precio: 750000, img: "img/base-espaldar-750a.jpg", badge: "Completo" },
        { nombre: "Base Cama + Colchón Semi Ortopédico + Espaldar", descripcion: "Base cama reforzada con espaldar y colchón semi ortopédico. Ideal para descanso diario.", precio: 850000, img: "img/base-semi-850.jpg", badge: "Recomendado" },
        { nombre: "Base Cama Modular Negra", descripcion: "Base cama modular color negro. Minimalista, resistente y fácil de armar. Solución económica.", precio: 160000, img: "img/base-modular-160.jpg", badge: "Económico" },
        { nombre: "🔥 Combo Sencillo: Base + Espaldar + Colchón Ortopédico", descripcion: "Set básico completo: base cama, espaldar sencillo y colchón ortopédico. Perfecto para empezar.", precio: 580000, img: "img/colchon-1.jpg", badge: "Oferta" }
    ];

    const container = document.getElementById('reelsContainer');
    const indicador = document.getElementById('indicador');

    productos.forEach((p, i) => {
        const mensaje = encodeURIComponent(`Hola, quiero comprar el *${p.nombre}* ($${p.precio.toLocaleString()})`);

        const reel = document.createElement('div');
        reel.className = 'reel';
        reel.innerHTML = `
            <img class="reel-bg" src="${p.img}" alt="${p.nombre}" loading="${i === 0 ? 'eager' : 'lazy'}">
            <div class="reel-content">
                <div class="tag">${p.badge}</div>
                <h2>${p.nombre}</h2>
                <p class="desc">${p.descripcion}</p>
                <p class="precio">$${p.precio.toLocaleString()} <small>+ envío</small></p>
                <a class="btn-wa-reel" href="https://wa.me/${WHATSAPP_NUMBER}?text=${mensaje}" target="_blank">
                    💬 Comprar por WhatsApp
                </a>
            </div>
        `;
        container.appendChild(reel);

        const dot = document.createElement('div');
        dot.className = 'dot' + (i === 0 ? ' active' : '');
        indicador.appendChild(dot);
    });

    container.addEventListener('scroll', () => {
        const h = container.clientHeight;
        const scrollTop = container.scrollTop;
        const idx = Math.round(scrollTop / h);

        document.querySelectorAll('.dot').forEach((d, i) => {
            d.classList.toggle('active', i === idx);
        });

        const hint = document.getElementById('swipeHint');
        if (scrollTop > 10) {
            hint.style.opacity = '0';
            hint.style.transition = 'opacity 0.5s';
        }
    });

    if ('ontouchstart' in window) {
        document.getElementById('swipeHint').style.display = 'block';
    } else {
        document.getElementById('swipeHint').style.display = 'none';
    }
</script>
</body>
</html>
